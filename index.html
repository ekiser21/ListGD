<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demon List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Titan+One&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0d0b1e;--card:#171433;--ink:#eeebff;--mut:#9b96c4;--line:#2b2750;--acc:#ff6a4d;--acc2:#a39cff}
[data-theme=light]{--bg:#eeecf8;--card:#fff;--ink:#1a1733;--mut:#68648a;--line:#e0ddf0;--acc:#e03a20;--acc2:#4b3fd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Rubik,system-ui,sans-serif;transition:background .3s,color .3s;min-height:100vh}
#bgl{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
header{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(12px);border-bottom:3px solid var(--acc);padding:8px 16px}
.hin{max-width:1040px;margin:0 auto}
.brand{font:400 22px 'Titan One',Rubik,sans-serif;display:flex;align-items:center;gap:10px;justify-content:space-between}
.bl{display:flex;align-items:center;gap:10px}.hr{display:flex;align-items:center;gap:8px;font:500 14px Rubik}
.logo{width:24px;height:24px;background:linear-gradient(135deg,var(--acc),#c2255c);transform:rotate(45deg) scale(.78);border-radius:5px;animation:pls 3s ease-in-out infinite}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:2px}
button,input,select,textarea{font:inherit;color:inherit}
.nav{background:none;border:0;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--mut);white-space:nowrap;transition:.2s}
.nav:hover{background:var(--bg)}.nav.on{background:var(--bg);color:var(--acc2);font-weight:700}
main{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
h1,h2,h3{font-weight:800;margin:0;letter-spacing:-.01em}h1{font-size:27px;line-height:1.25}h2{font-size:18px;margin:26px 0 10px}h3{font-size:15px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:12px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes sl{to{background-position:200% 0}}
@keyframes mv{to{background-position:40px 0}}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
@keyframes bl{50%{opacity:0}}
@keyframes pls{50%{transform:scale(1.06);filter:brightness(1.25)}}
@keyframes shn{to{transform:translateX(100%)}}
@keyframes glt{50%{filter:brightness(1.5) saturate(1.3)}}
@keyframes flo{50%{transform:translateY(-2px)}}
@keyframes flm{to{filter:brightness(1.4);box-shadow:0 0 12px var(--c)}}
@keyframes spn{to{transform:rotateY(360deg)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rp{50%{box-shadow:0 0 12px 3px var(--c)}}
@keyframes ne-pulse{50%{text-shadow:0 0 4px var(--c),0 0 14px var(--c)}}
@keyframes ne-flicker{0%,100%{opacity:1}45%{opacity:.35}50%{opacity:1}55%{opacity:.5}}
@keyframes ne-float{50%{transform:translateY(-3px)}}
@keyframes ne-shake{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes ne-skew{50%{transform:skewX(-10deg)}}
.anim>*{animation:in .45s cubic-bezier(.2,.8,.2,1) both}.anim>*:nth-child(n+2){animation-delay:.06s}.anim>*:nth-child(n+3){animation-delay:.12s}
.fx .card{transition:transform .2s,box-shadow .2s,border-color .2s}.fx .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 22%,transparent)}
.tw::after{content:"▍";color:var(--acc);animation:bl 1s steps(2) infinite}
.hero{background:linear-gradient(120deg,#2a1f6b,#7a1fa2 60%,#e03a20);color:#fff;border-radius:16px;padding:24px;margin-bottom:18px}
.hero p{margin:6px 0 0;opacity:.85}.hero .stat b{color:#fff}.hero .stat span{color:#ffffffb3}
.stat{display:flex;gap:24px;margin-top:12px;flex-wrap:wrap}.stat b{font:400 24px 'Titan One',Rubik,sans-serif;color:var(--acc);display:block;line-height:1.1}.stat span{font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tbl{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);font-weight:500;background:var(--bg)}tr:last-child td{border-bottom:0}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:var(--acc2);text-align:left}.link:hover{text-decoration:underline}a.link{text-decoration:none}
.chip,.rank,.ttl,.lvc{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;vertical-align:middle}.rank{border-radius:8px;font-weight:800}
.ttl{background:var(--bg);color:var(--acc2);border:1px solid var(--line)}
.lvc{background:linear-gradient(90deg,#4b3fd6,#a855f7)}
.rank{position:relative;overflow:hidden;display:inline-flex;gap:4px;align-items:center;background:var(--c)}
.rank b{display:inline-block}
.ra0::after,.ra1::after,.ra2::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-100%);animation:shn 3s infinite}
.ra3,.ra4,.ra5{animation:pls 2s ease-in-out infinite}.ra6,.ra7{animation:glt 2.5s ease-in-out infinite}
.ra8,.ra9,.ra14{animation:flo 3s ease-in-out infinite}.ra8 b,.ra9 b,.ra14 b{animation:spn 4s linear infinite}
.ra10,.ra11{box-shadow:0 0 10px var(--c);animation:pls 1.6s ease-in-out infinite}.ra12,.ra13{animation:flm .6s ease-in-out infinite alternate}
.ra14{background-size:300% 100%;animation:sl 3s linear infinite}
.row-l{display:grid;grid-template-columns:40px 56px 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;margin-top:10px;width:100%;text-align:left}
.btn-row{cursor:pointer}.btn-row:hover{border-color:var(--acc2)}
.rk{font:400 20px 'Titan One',Rubik,sans-serif;color:var(--mut);text-align:center}.row-l.top{border:2px solid var(--acc)}
.face{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 30%,var(--bg));border:3px solid var(--c);flex:none}
.th{width:100%;max-width:560px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block;background:var(--bg)}
.nm{font-weight:700}.ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ic{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:32px;height:32px;cursor:pointer}
:is(.ic,.nav,.btn,.link,input,select,textarea,.btn-row):focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.panel{padding:16px;margin-top:12px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
input,select,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:38px}
label{font-size:13px;color:var(--mut);display:grid;gap:3px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;justify-self:start;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:default}.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.red{background:#c92a2a}.btn.sm{padding:5px 10px;font-size:13px}
.err{background:#ffe3e0;color:#7a1308;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prof{overflow:hidden;position:relative}.bn{height:130px;background-size:cover;background-position:center;position:relative}.bn.mini{height:36px;border-radius:8px;overflow:hidden}
.prof>*:not(.fxo){position:relative;z-index:1}
.ph-head{display:flex;gap:16px;align-items:flex-start;padding:0 18px 12px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;padding:0 18px 18px}
.pbox{background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:0}
.pbox h3{margin-bottom:6px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.av{width:76px;height:76px;border-radius:50%;padding:4px;flex:none;margin-top:-38px;background-size:300% 100%;position:relative}
.av.big{width:104px;height:104px;margin-top:-52px;padding:5px}
.av>div{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;font:400 28px 'Titan One',Rubik,sans-serif;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:44px;height:44px;margin:0;padding:3px}.av.xs{width:32px;height:32px;margin:0 6px 0 0;padding:2px;display:inline-block;vertical-align:middle}.av.xs>div{font-size:13px}
.dot{position:absolute;right:2px;bottom:2px;width:18px;height:18px;border-radius:50%;border:3px solid var(--card);z-index:3}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .8s}
.ach{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:9px 11px}.ach .ai{font-size:26px;text-align:center}.ach small{color:var(--mut);display:block;line-height:1.25}.lock{opacity:.35;filter:grayscale(1)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px;margin-top:10px}.shop .card{padding:12px;display:grid;gap:8px;align-content:space-between;position:relative}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.tabs .btn{white-space:nowrap}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
.chatw{display:grid;grid-template-columns:190px 1fr;gap:12px;margin-top:12px}.side{padding:10px;display:grid;gap:4px;align-content:start}.side .nav{text-align:left}
.msgs{height:50vh;overflow-y:auto;padding:12px;display:grid;gap:6px;align-content:start}
.msg{max-width:84%;background:var(--bg);border-radius:12px;padding:6px 11px;animation:in .3s both;word-break:break-word}.msg.me{justify-self:end;background:color-mix(in srgb,var(--acc) 25%,var(--bg))}
.msg small{color:var(--mut)}.msg.g{margin-top:-4px}.send{display:flex;gap:8px;margin-top:10px}.men{background:#5865f255;border-radius:4px;padding:0 3px}.rpl{font-size:12px;color:var(--mut);border-left:3px solid var(--acc2);padding-left:6px;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;animation:tin .3s both;box-shadow:0 8px 24px #0006}
.auth{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:860px;margin:30px auto;align-items:center}.auth .aside{background:linear-gradient(135deg,#2a1f6b,#7a1fa2 60%,#e03a20);color:#fff;border-radius:16px;padding:28px;min-height:340px}
.pw{display:flex;gap:6px}.logo.big{width:46px;height:46px;margin:10px 0 18px}
.np{position:fixed;top:56px;right:12px;width:340px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;z-index:20;padding:12px;display:grid;gap:8px;box-shadow:0 12px 40px #0008}
.bellb{position:relative}.cnt{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:0 5px;font-weight:700}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 12px;margin-top:8px;position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.lrow>*:not(.fxo){position:relative;z-index:1}.lrow .rk{font-size:18px}
.aw{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px 4px 3px 0;font-size:12px;font-weight:500}
.tro,.crown,.emb{vertical-align:middle;flex:none}.emb.glow{filter:drop-shadow(0 0 6px var(--ec,#fff8))}.crown{filter:drop-shadow(0 1px 4px #0008);animation:flo 2.4s ease-in-out infinite}
.reels{display:flex;gap:10px;justify-content:center;font-size:58px;margin:10px 0}.reel{background:var(--bg);border-radius:14px;padding:6px 16px;border:1px solid var(--line)}.reels.spin .reel{filter:blur(2px)}
.ctag{font-size:.8em;font-weight:800}
.qcd{font:700 18px Rubik;color:var(--acc2)}
.fxbox{height:40px;border-radius:8px;position:relative;overflow:hidden;background:#0008}
.lock-o{position:absolute;inset:0;background:#000a;color:#fff;display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;border-radius:14px;z-index:2;padding:6px}
@media (max-width:640px){.row,.row3{grid-template-columns:1fr}.row-l{grid-template-columns:30px 48px 1fr auto}.pgrid,.auth,.chatw{grid-template-columns:1fr}.face{width:40px;height:40px;font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* profile & page effects, tinted with --h */
.fxo{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;filter:hue-rotate(var(--h,0deg));z-index:0;
 --dots:radial-gradient(2px 2px at 20px 30px,var(--d,#fff),transparent),radial-gradient(1.5px 1.5px at 90px 80px,var(--d,#fff),transparent),radial-gradient(2px 2px at 150px 130px,var(--d,#fff),transparent),radial-gradient(1px 1px at 60px 140px,var(--d,#fff),transparent)}
.fxo::before,.fxo::after{content:"";position:absolute;inset:0;background-repeat:repeat}
@keyframes dr{to{background-position:-170px -160px}}@keyframes tw{from{opacity:.15}to{opacity:.95}}
@keyframes fy{to{background-position:0 160px}}@keyframes ry{to{background-position:0 -160px}}
@keyframes swp{from{background-position:0 0}to{background-position:100% 0}}@keyframes fl{to{opacity:.55;transform:scaleY(1.08)}}
@keyframes fz{0%,88%,100%{opacity:0}90%{opacity:.9}92%{opacity:.1}94%{opacity:.8}}
@keyframes gl{0%{background-position:0 0;opacity:1}50%{background-position:8px 3px;opacity:.5}100%{background-position:-6px 0;opacity:1}}
@keyframes rn{to{background-position:-16px 40px}}@keyframes nb{to{background-position:100% 100%}}@keyframes gd{to{background-position:0 24px,0 0}}
.fx-galaxy{--d:#fff;background:radial-gradient(ellipse at 25% 35%,#7c3aed77,transparent 55%),radial-gradient(ellipse at 75% 65%,#2563eb77,transparent 55%),#0b062099}
.fx-galaxy::before{background-image:var(--dots);background-size:170px 160px;animation:dr 50s linear infinite}.fx-galaxy::after{background-image:var(--dots);background-size:230px 160px;animation:tw 3s ease-in-out infinite alternate}
.fx-aurora{background:linear-gradient(115deg,transparent 15%,#22d3ee66 35%,#a855f766 55%,#22c55e55 70%,transparent 90%);background-size:220% 100%;animation:swp 9s ease-in-out infinite alternate}
.fx-matrix{background:#00140866}.fx-matrix::before{background-image:repeating-linear-gradient(90deg,transparent 0 9px,#22c55e33 9px 11px)}.fx-matrix::after{background-image:linear-gradient(180deg,transparent,#4ade80aa 50%,transparent);background-size:100% 160px;animation:fy 2.2s linear infinite}
.fx-fire{background:linear-gradient(0deg,#f9731699,#ef444444 35%,transparent 65%);animation:fl 1.4s ease-in-out infinite alternate;--d:#fbbf24}.fx-fire::before{background-image:var(--dots);background-size:170px 160px;animation:ry 3s linear infinite}
.fx-snow{--d:#fff}.fx-snow::before{background-image:var(--dots);background-size:170px 160px;animation:fy 6s linear infinite}.fx-snow::after{background-image:var(--dots);background-size:230px 160px;animation:fy 9s linear infinite}
.fx-sakura{--d:#f9a8d4}.fx-sakura::before{background-image:var(--dots);background-size:170px 160px;animation:fy 8s linear infinite}.fx-sakura::after{background-image:var(--dots);background-size:230px 160px;animation:fy 12s linear infinite}
.fx-lightning{background:linear-gradient(180deg,#1e3a8a44,transparent)}.fx-lightning::before{background:radial-gradient(circle at 70% 0,#fff,#93c5fd88 20%,transparent 50%);animation:fz 4s infinite;opacity:0}
.fx-bubbles{--d:#7dd3fc}.fx-bubbles::before{background-image:var(--dots);background-size:170px 160px;animation:ry 7s linear infinite}.fx-bubbles::after{background-image:var(--dots);background-size:230px 160px;animation:ry 11s linear infinite}
.fx-stars{--d:#fff}.fx-stars::before{background-image:var(--dots);background-size:170px 160px;animation:tw 2s ease-in-out infinite alternate}.fx-stars::after{background-image:var(--dots);background-size:230px 160px;animation:tw 3s ease-in-out infinite alternate-reverse}
.fx-glitch::before{background:repeating-linear-gradient(0deg,transparent 0 5px,#f43f5e33 5px 6px);animation:gl .9s steps(2) infinite}.fx-glitch::after{background:repeating-linear-gradient(0deg,transparent 0 7px,#22d3ee33 7px 8px);animation:gl 1.3s steps(2) infinite reverse}
.fx-rain::before{background-image:linear-gradient(100deg,transparent 46%,#93c5fdaa 50%,transparent 54%);background-size:16px 40px;animation:rn .5s linear infinite}
.fx-embers{--d:#fb923c;background:linear-gradient(0deg,#7f1d1d66,transparent 60%)}.fx-embers::before{background-image:var(--dots);background-size:170px 160px;animation:ry 4s linear infinite}.fx-embers::after{background-image:var(--dots);background-size:230px 160px;animation:ry 6s linear infinite}
.fx-confetti::before{background-image:radial-gradient(3px 3px at 20px 30px,#f43f5e,transparent),radial-gradient(3px 3px at 90px 80px,#22c55e,transparent),radial-gradient(3px 3px at 150px 130px,#3b82f6,transparent),radial-gradient(3px 3px at 60px 140px,#eab308,transparent);background-size:170px 160px;animation:fy 5s linear infinite}
.fx-nebula{background:radial-gradient(circle at 20% 30%,#ec489988,transparent 40%),radial-gradient(circle at 80% 70%,#06b6d488,transparent 40%),radial-gradient(circle at 50% 50%,#8b5cf666,transparent 50%);background-size:200% 200%;animation:nb 14s ease-in-out infinite alternate}
.fx-vortex::before{inset:-60%;background:conic-gradient(#a855f700,#a855f799,#06b6d400 50%,#06b6d499,#a855f700);animation:sp 6s linear infinite}
.fx-fireflies{--d:#fde047}.fx-fireflies::before{background-image:var(--dots);background-size:170px 160px;animation:ry 14s linear infinite}.fx-fireflies::after{background-image:var(--dots);background-size:230px 160px;animation:tw 1.5s ease-in-out infinite alternate}
.fx-hearts{--d:#fb7185}.fx-hearts::before{background-image:radial-gradient(4px 4px at 20px 30px,var(--d),transparent),radial-gradient(3px 3px at 100px 90px,var(--d),transparent),radial-gradient(4px 4px at 150px 130px,var(--d),transparent);background-size:170px 160px;animation:ry 6s linear infinite}
.fx-sparkle{--d:#fff}.fx-sparkle::before{background-image:var(--dots);background-size:120px 160px;animation:tw .8s ease-in-out infinite alternate}.fx-sparkle::after{background-image:var(--dots);background-size:170px 160px;animation:tw 1.1s ease-in-out infinite alternate-reverse}
.fx-blackhole{background:radial-gradient(circle at 50% 50%,#000 12%,#f9731666 18%,#7c3aed44 30%,transparent 55%)}.fx-blackhole::before{inset:10%;border-radius:50%;background:conic-gradient(#f9731600,#f97316aa,#f9731600 40%);-webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 48%,transparent 50%);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 48%,transparent 50%);animation:sp 3s linear infinite}
.fx-grid{background-image:linear-gradient(#22d3ee55 1px,transparent 1px),linear-gradient(90deg,#22d3ee55 1px,transparent 1px);background-size:24px 24px;animation:gd 3s linear infinite}

/* avatar effects, tinted with --pc */
@keyframes aur{50%{opacity:.35;transform:scale(1.12)}}@keyframes rpl{to{transform:scale(1.7);opacity:0}}@keyframes flk{to{transform:scale(1.06) translateY(-1px);opacity:.7}}
@keyframes gtc{0%{transform:translate(0)}33%{transform:translate(2px,-1px)}66%{transform:translate(-2px,1px)}}@keyframes elc{50%{opacity:.4;transform:skewX(6deg)}}
.pe-aura::after,.pe-orbit::after,.pe-halo::after,.pe-electric::after,.pe-ripple::after,.pe-flame::after,.pe-glitch::after,.pe-sparks::before{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:4}
.pe-aura::after{inset:-2px;box-shadow:0 0 14px 4px var(--pc);animation:aur 2s ease-in-out infinite}
.pe-orbit::after{inset:-8px;border:2px dashed var(--pc);animation:sp 7s linear infinite}
.pe-halo::after{left:15%;right:15%;top:-11px;height:10px;border:3px solid var(--pc);box-shadow:0 0 8px var(--pc);animation:flo 2.5s ease-in-out infinite}
.pe-sparks::before{inset:-7px;background:radial-gradient(circle at 50% 0,var(--pc) 3px,transparent 4px),radial-gradient(circle at 50% 100%,var(--pc) 2px,transparent 3px),radial-gradient(circle at 0 50%,var(--pc) 2px,transparent 3px);animation:sp 3s linear infinite}

const MUSIC=[["off","Off"],["site","Site music (set by the owner)"],["dream","Dreamy pads"],["arcade","Arcade pulse"],["night","Midnight drive"],["lofi","Rainy lofi"],["url","My own link"]];
const SCALES={dream:[0,2,4,7,9],arcade:[0,2,3,7,8],night:[0,3,5,7,10],lofi:[0,2,4,5,7,9,11]};
let BG={t:null,au:null,timer:null,g:null,step:0};
function bgStop(){clearInterval(BG.timer);BG.timer=null;if(BG.au){BG.au.pause();BG.au=null}if(BG.g){try{BG.g.disconnect()}catch(e){}BG.g=null}}
function bgStart(){bgStop();const t=S.bgt||"off";if(t==="off")return;const vol=(S.bgv==null?.4:S.bgv);
 if(t==="url"||t==="site"){const u=t==="url"?S.bgu:cfg.bgm;if(!/^https?:\/\//.test(u||""))return;const a=new Audio(u);a.loop=true;a.volume=vol;a.play().catch(()=>{});BG.au=a;return}
 try{ac=ac||new AudioContext();if(ac.state==="suspended")ac.resume()}catch(e){return}
 const g=ac.createGain();g.gain.value=vol*.35;g.connect(ac.destination);BG.g=g;const sc=SCALES[t]||SCALES.dream,root=t==="night"?110:t==="arcade"?146.8:t==="lofi"?130.8:123.5,R=rng(hsh(t)),bpm={dream:50,arcade:128,night:96,lofi:76}[t],stepMs=60000/bpm/2*1000/1000;
 const note=(f,d,type,vv,at)=>{const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(0,at);e.gain.linearRampToValueAtTime(vv,at+Math.min(.05,d/4));e.gain.exponentialRampToValueAtTime(.0005,at+d);o.connect(e);e.connect(g);o.start(at);o.stop(at+d+.05)};
 const fr=(deg,oct)=>root*2**(oct+sc[((deg%sc.length)+sc.length)%sc.length]/12+Math.floor(deg/sc.length));
 BG.step=0;const tick=()=>{if(!BG.g)return;const at=ac.currentTime+.05,s=BG.step++,bar=Math.floor(s/16),ch=[0,3,4,2][bar%4];
  if(t==="dream"){if(s%16===0){[0,2,4].forEach(k=>note(fr(ch+k,0),4.5,"sine",.25,at))}if(s%4===0&&R()<.7)note(fr(ch+rnd0(R,6),2),2,"triangle",.12,at)}
  else if(t==="arcade"){if(s%2===0)note(fr(ch,-1),.18,"square",.16,at);note(fr(ch+[0,2,4,2][s%4]+(s%16>7?2:0),1),.12,"square",.09,at);if(s%8===4)note(90,.12,"triangle",.3,at)}
  else if(t==="night"){if(s%4===0)note(fr(ch,-1),.5,"sawtooth",.12,at);if(s%8===0)[0,2,4].forEach(k=>note(fr(ch+k,1),1.6,"triangle",.08,at));if(s%2===1&&R()<.5)note(fr(ch+rnd0(R,5),2),.25,"sine",.08,at)}
  else{if(s%8===0)[0,2,4,6].forEach(k=>note(fr(ch+k,0),2.4,"triangle",.1,at));if(s%4===0)note(70,.14,"sine",.35,at);if(s%4===2&&R()<.8)note(fr(ch+rnd0(R,7),2),.4,"sine",.07,at)}};
 BG.timer=setInterval(tick,Math.round(60000/bpm/2))}
function bgGesture(){if(S.bgt&&S.bgt!=="off"&&!BG.timer&&!BG.au)bgStart()}
document.addEventListener("pointerdown",bgGesture);
document.addEventListener("change",e=>{const t=e.target;if(t.id==="bgt"){S.bgt=t.value;sv();bgStart()}else if(t.id==="bgv"){S.bgv=+t.value/100;sv();if(BG.au)BG.au.volume=S.bgv;if(BG.g)BG.g.gain.value=S.bgv*.35}else if(t.id==="bgu"){S.bgu=t.value.trim().slice(0,300);sv();if(S.bgt==="url")bgStart()}else if(t.id==="hvs"){S.hs=t.checked;sv()}});
function musicH(){return `<h2>Music and sound</h2><div class="card panel"><div class="row"><label>Background music<select id="bgt">${MUSIC.map(([k,n])=>`<option value="${k}"${(S.bgt||"off")===k?" selected":""}>${n}</option>`).join("")}</select></label><label>Music volume<input id="bgv" type="range" min="0" max="100" value="${Math.round((S.bgv==null?.4:S.bgv)*100)}"></label></div><label>Your own music (link to an mp3 or other audio file)<input id="bgu" type="url" placeholder="https://…/song.mp3" value="${esc(S.bgu||"")}"></label><label style="display:flex;gap:8px;align-items:center"><input id="hvs" type="checkbox" style="width:auto"${S.hs!==false?" checked":""}>Soft sound when hovering over buttons and cards</label><span class="mut sm">Music starts after your first click on the page. Pick “Off” to stop it. Links must allow playing from other websites.</span></div>`}
function settings(){return settings0()+musicH()}
/* ---------- more upgrades ---------- */
UPG.push({id:"cm",n:"Coin collector",d:"+3% coins from clears per level",max:10,cur:"c",cost:i=>1500*(i+1),ic:"🪙"},{id:"dsc",n:"Shop discount",d:"2% off shop cosmetics per level",max:10,cur:"c",cost:i=>2000*(i+1),ic:"🏷️"},{id:"pkd",n:"Pack discount",d:"3% off pack diamond prices per level",max:8,cur:"d",cost:i=>25*(i+1),ic:"🎟️"},{id:"cvx",n:"Bigger converter",d:"+100 coins of daily conversion room per level",max:10,cur:"d",cost:i=>15*(i+1),ic:"🔁"});
/* ---------- pixel-art trophies (original design) ---------- */
const TROG=["..OOOOOOOOOO..",".OFFFFFFFFFFO.","OFOFHFFFFFDOFO","OFOFHFFFFFDOFO",".OOFHFFFFFDOO.","..OFFFFFFFDO..","...OFFFFFDO...","....OFFFDO....",".....OFDO.....",".....OFDO.....","....OFFDDO....","...OFFFFDDO...","..OOOOOOOOOO..","..OFFFFFFDDO..","..OOOOOOOOOO.."];
function trophy(c,ic,sz){const w=sz||32,col={O:shade(c,-.62),F:c,H:shade(c,.62),D:shade(c,-.32)};let r="";
 TROG.forEach((row,y)=>{let x=0;while(x<14){const ch=row[x];if(ch==="."){x++;continue}let n=1;while(x+n<14&&row[x+n]===ch)n++;r+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${col[ch]}"/>`;x+=n}});
 const t=ic&&String(ic).length<=2?`<text x="7" y="5.4" font-size="3.6" text-anchor="middle" fill="${col.O}" font-weight="700">${esc(String(ic))}</text>`:"";
 return `<svg class="tro" viewBox="0 0 14 15" width="${w}" height="${Math.round(w*15/14)}" shape-rendering="crispEdges" aria-hidden="true">${r}${t}</svg>`}

/* ---------- firebase boot ---------- */
function sub(c,f,q){return(q||db.collection(c)).onSnapshot(s=>{f(s);rr()},e=>{err="Couldn’t load "+c+" ("+e.code+").";rr()})}
const arr=s=>s.docs.map(d=>({id:d.id,...d.data()}));
(()=>{
 try{firebase.initializeApp(FB);db=firebase.firestore()}catch(e){err="Couldn’t connect. Check the Firebase setup ("+(e.code||e.message)+").";loaded=true;authReady=true;return render()}
 sub("players",s=>{players=arr(s);loaded=true});sub("roles",s=>{roles={};rolesX={};s.docs.forEach(d=>{roles[d.id]=d.data().role||"";rolesX[d.id]=d.data().extra||[]})});
 sub("bans",s=>{bans={};s.docs.forEach(d=>bans[d.id]=d.data())});sub("adj",s=>{adjs={};s.docs.forEach(d=>adjs[d.id]=d.data())});
 sub("quests",s=>oldq=arr(s));sub("bounties",s=>bounties=arr(s));sub("list",s=>list=arr(s));sub("records",s=>recs=arr(s));
 sub("custom",s=>customs=arr(s));sub("qpool",s=>qpool=arr(s));sub("qsub",s=>qsubs=arr(s));sub("clans",s=>clans=arr(s));sub("events",s=>evs=arr(s));sub("evreg",s=>evregs=arr(s));
 sub("news",s=>news=arr(s),db.collection("news").orderBy("t","desc").limit(15));
 db.collection("chat").orderBy("t","desc").limit(150).onSnapshot(s=>{const o=chat.length;chat=arr(s).reverse();const l=chat[chat.length-1];if(o&&l&&l.uid!==me&&view.t==="chat"&&(l.ch||"general")===CHV.ch&&!CHV.room)snd("msg");rr()},()=>{});
 db.doc("config/points").onSnapshot(s=>{cfg=s.data()||{};rr()},()=>{});db.doc("config/order").onSnapshot(s=>{cfgO=s.data()||{};rr()},()=>{});
 db.doc("config/quests").onSnapshot(s=>{cfgQ=s.data()||{};rr()},()=>{});db.doc("config/lvover").onSnapshot(s=>{lvo=s.data()||{};rr()},()=>{});
 firebase.auth().onAuthStateChanged(u=>{me=u?u.uid:null;email=u?u.email||"":"";adm=false;unsub.forEach(f=>f());unsub=[];frs=[];nfs=[];rooms=[];rmsgs=[];trades=[];if(unsubR){unsubR();unsubR=null}CHV.room=null;greeted=false;
  if(me){unsub.push(db.doc("admins/"+me).onSnapshot(s=>{adm=s.exists;if(adm&&roles[me]!=="owner")db.doc("roles/"+me).set({role:"owner"}).catch(()=>{});rr()},()=>{}));
   let a1=[],a2=[];
   unsub.push(db.collection("friends").where("from","==",me).onSnapshot(s=>{a1=arr(s);frs=[...a1,...a2];rr()},()=>{}));
   unsub.push(db.collection("friends").where("to","==",me).onSnapshot(s=>{a2=arr(s);frs=[...a1,...a2];rr()},()=>{}));
   let t1=[],t2=[];
   unsub.push(db.collection("trades").where("from","==",me).onSnapshot(s=>{t1=arr(s);trades=[...t1,...t2];rr()},()=>{}));
   unsub.push(db.collection("trades").where("to","==",me).onSnapshot(s=>{t2=arr(s);trades=[...t1,...t2];rr()},()=>{}));
   unsub.push(db.collection("notifs").where("to","==",me).onSnapshot(s=>{const o=nfs.length;nfs=arr(s).sort((a,b)=>b.t-a.t);if(o&&nfs.length>o){snd("bell");toast("🔔 "+nfs[0].text)}rr()},()=>{}));
   unsub.push(db.collection("rooms").where("members","array-contains",me).onSnapshot(s=>{rooms=arr(s);rr()},()=>{}))}
  authReady=true;view={t:"demons",fresh:true};rr()});
})();
